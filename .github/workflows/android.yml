name: Android CI

on:
  push:
    branches: [ "master", "main", "jules-*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Generate Signature Fingerprints
      run: |
        set -e
        set -o pipefail

        APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
          echo "Error: APK file not found!" >&2
          exit 1
        fi

        export APK_NAME=$(basename "$APK_PATH")
        export COMMIT_SHA="${{ github.sha }}"

        # Extract Package Name / Application ID from build.gradle.kts
        PACKAGE_NAME=$(grep -E 'applicationId\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$PACKAGE_NAME" ]; then
          PACKAGE_NAME="com.fubon.fxmonitor"
        fi
        export PACKAGE_NAME

        # Find apksigner tool
        APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
        if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
          echo "Error: apksigner not found or not executable!" >&2
          exit 1
        fi

        echo "Using apksigner at: $APKSIGNER"

        # Verify signature with apksigner (Fail if verification fails)
        VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")

        export SHA1=$(echo "$VERIFY_OUTPUT" | grep -i "certificate SHA-1 digest:" | head -n 1 | awk '{print $NF}')
        export SHA256=$(echo "$VERIFY_OUTPUT" | grep -i "certificate SHA-256 digest:" | head -n 1 | awk '{print $NF}')

        if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
          echo "Error: Failed to extract SHA-1 or SHA-256 certificate fingerprints from apksigner output!" >&2
          echo "$VERIFY_OUTPUT" >&2
          exit 1
        fi

        # Compute APK file checksum
        export FILE_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
        echo "$FILE_SHA256" > "${APK_PATH}.sha256"

        python3 -c "
        import os
        report = (
            '=== APK 簽章指紋報告 ===\n'
            f'APK 檔名: {os.environ[\"APK_NAME\"]}\n'
            f'Commit SHA: {os.environ[\"COMMIT_SHA\"]}\n'
            f'Application ID / Package: {os.environ[\"PACKAGE_NAME\"]}\n'
            '簽章狀態: Android Debug 簽章\n\n'
            '[簽章憑證指紋]\n'
            f'SHA-1 指紋: {os.environ[\"SHA1\"]}\n'
            f'SHA-256 指紋: {os.environ[\"SHA256\"]}\n\n'
            '[APK 檔案校驗碼 (File Checksum)]\n'
            f'SHA-256 校驗碼: {os.environ[\"FILE_SHA256\"]}\n\n'
            f'註：{os.environ[\"APK_NAME\"]}.sha256 為 APK 檔案校驗碼（File Checksum），僅用於下載完整性比對。\n'
        )
        with open('apk_signature_fingerprints.txt', 'w', encoding='utf-8') as f:
            f.write(report)
        "

        echo "=== 簽章報告內容 ==="
        cat apk_signature_fingerprints.txt

        # Write to Github Actions Summary
        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          cat apk_signature_fingerprints.txt >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
