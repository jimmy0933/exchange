name: Android CI

on:
  push:
    branches: [ "master", "main", "jules-*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Setup Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "KEYSTORE_BASE64 is set, decoding keystore..."
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Error: KEYSTORE_BASE64 is provided but one or more required secrets (KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are missing!" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          if [ ! -s app/release.keystore ]; then
            echo "Error: Failed to decode release.keystore or keystore file is empty!" >&2
            exit 1
          fi
          echo "Keystore successfully configured."
        else
          echo "No KEYSTORE_BASE64 provided. Using default debug keystore."
        fi

    - name: Build Debug APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -f "app/release.keystore" ]; then
          echo "Building APK with custom keystore..."
          KEYSTORE_FILE="release.keystore" ./gradlew assembleDebug --no-daemon
        else
          echo "Building APK with default debug keystore..."
          ./gradlew assembleDebug --no-daemon
        fi

    - name: Generate Signature Fingerprints
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        set -e
        set -o pipefail

        APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
          echo "Error: APK file not found!" >&2
          exit 1
        fi

        APK_NAME=$(basename "$APK_PATH")
        COMMIT_SHA="${{ github.sha }}"

        # Dynamically extract Package Name / Application ID from build.gradle.kts
        PACKAGE_NAME=$(grep -E 'applicationId\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$PACKAGE_NAME" ]; then
          PACKAGE_NAME="com.fubon.fxmonitor"
        fi

        # Find apksigner tool
        APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
        if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
          echo "Error: apksigner not found or not executable!" >&2
          exit 1
        fi

        echo "Using apksigner at: $APKSIGNER"

        # Verify signature with apksigner (Fail if verification fails)
        VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")

        SHA1=$(echo "$VERIFY_OUTPUT" | grep "Signer #1 certificate SHA-1 digest:" | awk '{print $6}')
        SHA256=$(echo "$VERIFY_OUTPUT" | grep "Signer #1 certificate SHA-256 digest:" | awk '{print $6}')

        if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
          echo "Error: Failed to extract SHA-1 or SHA-256 certificate fingerprints from apksigner output!" >&2
          echo "$VERIFY_OUTPUT" >&2
          exit 1
        fi

        # Compute APK file checksum
        FILE_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
        echo "$FILE_SHA256" > "${APK_PATH}.sha256"

        SIGNATURE_TYPE="臨時 Debug 簽章"
        SECRETS_NOTE=""
        if [ -n "$KEYSTORE_BASE64" ]; then
          SIGNATURE_TYPE="固定密鑰庫簽章"
        else
          SECRETS_NOTE="⚠️ 未設定 KEYSTORE_BASE64，目前使用臨時 Debug 簽章。若要使用固定簽章，請在 Repository Secrets 設定以下項目：\n- KEYSTORE_BASE64\n- KEYSTORE_PASSWORD\n- KEY_ALIAS\n- KEY_PASSWORD"
        fi

        cat <<EOF > apk_signature_fingerprints.txt
=== APK 簽章指紋報告 ===
APK 檔名: ${APK_NAME}
Commit SHA: ${COMMIT_SHA}
Application ID / Package: ${PACKAGE_NAME}
簽章狀態: ${SIGNATURE_TYPE}

[Google Cloud OAuth 簽章憑證指紋]
SHA-1 指紋: ${SHA1}
SHA-256 指紋: ${SHA256}

[APK 檔案校驗碼 (File Checksum)]
SHA-256 校驗碼: ${FILE_SHA256}

註：${APK_NAME}.sha256 為 APK 檔案校驗碼（File Checksum），僅用於下載完整性比對，不可作為 Google Cloud OAuth 的簽章 SHA-1 使用。
EOF

        if [ -n "$SECRETS_NOTE" ]; then
          echo -e "\n[Secrets 待設定項目]\n$SECRETS_NOTE" >> apk_signature_fingerprints.txt
        fi

        echo "=== 簽章報告內容 ==="
        cat apk_signature_fingerprints.txt

        # Write to Github Actions Summary
        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          cat apk_signature_fingerprints.txt >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Fingerprint Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk-signature-fingerprints
        path: |
          apk_signature_fingerprints.txt
          app/build/outputs/apk/debug/*.sha256
